<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2f7cf6"><title>待辦事項</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/icon-192.svg"><link rel="stylesheet" href="layout-config.css"><link rel="stylesheet" href="style.css"></head><body>
<div class="app">
<section id="listPage" class="page active"><header class="topbar"><button id="menuBtn" class="icon-btn">☰</button><div class="title">待辦事項</div><div class="version">v1.0.0</div></header><div class="tabs-wrap"><div id="tabs" class="tabs"></div></div><div class="composer"><textarea id="taskInput" placeholder="輸入待辦事項…"></textarea><div class="composer-controls"><select id="categorySelect" class="select-btn"></select><select id="prioritySelect" class="select-btn"></select><input id="dueDate" class="date-input" type="date"><button id="addBtn" class="add-btn">＋</button></div></div><div class="toolbar"><span id="taskCount" class="count">0 項</span><input id="search" class="search" placeholder="搜尋待辦"></div><div id="taskList" class="task-list"></div></section>

<section id="tabPage" class="page"><header class="topbar"><button class="icon-btn" data-nav="listPage">‹</button><div class="title">頁籤管理</div><div class="version">v1.0.0</div></header><div class="section-card"><div class="section-title"><span>調整頁籤順序</span><small style="color:var(--muted)">手機可直接上下移動</small></div><div id="tabManager"></div></div></section>
<section id="managePage" class="page"><header class="topbar"><button class="icon-btn" data-nav="listPage">‹</button><div class="title">分類 / 優先級管理</div><div class="version">v1.0.0</div></header><div class="section-card"><div class="section-title"><span>管理分類</span><button id="addCategory" class="btn">＋ 新增分類</button></div><div id="categoryManager"></div></div><div class="section-card"><div class="section-title"><span>優先級</span><button id="addPriority" class="btn">＋ 新增優先級</button></div><div id="priorityManager"></div></div></section>
<section id="calendarPage" class="page"><header class="topbar"><button class="icon-btn" data-nav="listPage">‹</button><div class="title">日曆</div><button id="todayMonth" class="btn">今天</button></header><div class="section-card"><div class="calendar-head"><button id="prevMonth" class="btn">‹ 上一月</button><strong id="monthLabel"></strong><button id="nextMonth" class="btn">下一月 ›</button></div><div id="calendarGrid" class="calendar-grid"></div></div><div class="section-card"><div class="section-title"><span id="selectedDateLabel"></span></div><div id="calendarTasks" class="task-list"></div></div></section>
<section id="backupPage" class="page"><header class="topbar"><button class="icon-btn" data-nav="listPage">‹</button><div class="title">備份與版本</div><div class="version">v1.0.0</div></header><button id="exportBtn" class="utility-card" style="width:100%;background:var(--surface);color:inherit"><span><strong>匯出備份</strong><small>將所有資料匯出為 JSON</small></span><span>›</span></button><label class="utility-card"><span><strong>匯入備份</strong><small>從備份檔合併資料</small></span><span>›</span><input id="importInput" type="file" accept="application/json" class="hidden"></label><div id="backupStatus" class="status hidden">✓ 備份完整性檢查通過</div><button id="checkVersionBtn" class="utility-card" style="width:100%;background:var(--surface);color:inherit"><span><strong>檢查新版本</strong><small>目前版本：v1.0.0</small></span><span>›</span></button><div id="updateBox" class="update-box hidden"><strong>發現新版本 v<span data-latest-version></span></strong><p>更新只替換程式與快取，不會刪除既有 IndexedDB 紀錄。</p><div class="row"><button id="applyUpdateBtn" class="btn primary">立即更新</button><button id="laterUpdateBtn" class="btn">稍後</button></div></div></section>
</div>
<div id="overlay" class="overlay"></div><aside id="drawer" class="drawer"><div class="drawer-head"><div><h2>待辦事項</h2><small class="version">v1.0.0</small></div><button id="drawerClose" class="icon-btn">×</button></div><button class="nav-item primary" data-nav="listPage">⌂ 清單</button><button class="nav-item" data-nav="calendarPage">▣ 日曆</button><button class="nav-item" data-nav="backupPage">☁ 備份與還原</button><button class="nav-item" data-nav="tabPage">↕ 頁籤管理</button><button class="nav-item" data-nav="managePage">▤ 分類 / 優先級</button><div class="divider"></div><div class="nav-item">◐ 深色模式<select id="themeSelect" class="switch"><option value="system">跟隨系統</option><option value="light">淺色</option><option value="dark">深色</option></select></div><button class="nav-item" onclick="checkVersion(true)">↻ 檢查新版本</button><div class="nav-item">ⓘ 關於 / 版本資訊 <span class="version" style="margin-left:auto">v1.0.0</span></div></aside>
<div id="sheet" class="sheet"><div class="sheet-handle"></div><button id="actionEdit" class="action">✎　修改</button><button id="actionOrder" class="action">↕　調整順序</button><button id="actionDelete" class="action danger">🗑　刪除</button></div>
<div id="taskModal" class="modal"><div class="modal-card"><h3>修改待辦</h3><div class="field"><label>內容</label><textarea id="editContent"></textarea></div><div class="row"><div class="field"><label>分類</label><select id="editCategory"></select></div><div class="field"><label>優先級</label><select id="editPriority"></select></div></div><div class="field"><label>日期</label><input id="editDate" type="date"></div><label><input id="editCompleted" type="checkbox"> 已完成</label><div class="modal-actions"><button id="cancelTaskEdit" class="btn">取消</button><button id="saveTaskEdit" class="btn primary">儲存</button></div></div></div>
<div id="managerModal" class="modal"><div class="modal-card"><h3 id="managerTitle"></h3><input id="managerType" type="hidden"><input id="managerId" type="hidden"><div class="field"><label>名稱</label><input id="managerName"></div><div class="field"><label>顏色</label><input id="managerColor" type="color" value="#3b82f6"></div><div class="modal-actions"><button id="cancelManager" class="btn">取消</button><button id="saveManager" class="btn primary">儲存</button></div></div></div>
<div id="toast" class="toast"></div><div id="undo" class="toast"></div><div class="footer">Todo PWA · v1.0.0</div>
<script src="db.js"></script><script src="backup.js"></script><script src="version.js"></script><script src="app.js"></script></body></html>
